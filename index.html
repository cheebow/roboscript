<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ROBOSCRIPT</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span id="screens">
          <button id="screen-program" class="tab" type="button" title="Write and debug the programs of ALPHA and BRAVO">PROGRAM</button>
          <button id="screen-arena" class="tab" type="button" title="Pick robots from the garage and watch them fight">ARENA</button>
        </span>
        <span id="project-name"></span>
        <span id="message"></span>
        <div id="controls">
          <label class="picker">MAP <select id="arena"></select></label>
          <button id="run" class="tool-button" type="button">RUN</button>
          <button id="pause" class="tool-button" type="button">PAUSE</button>
          <button id="reset" class="tool-button" type="button">RESET</button>
          <button id="debug" class="tool-button" type="button">DEBUG</button>
        </div>
      </header>

      <section id="project" class="panel">
        <h2>PROJECT</h2>
        <div id="project-tree" class="panel-body"></div>
        <h2>GARAGE</h2>
        <div id="garage" class="panel-body"></div>
      </section>

      <section id="editor" class="panel">
        <h2>
          <span id="editor-title"></span>
          <span id="template-menu" class="menu">
            <button id="load-template" class="menu-button" type="button" title="Replace the code with a template (undo with Cmd/Ctrl+Z)">LOAD TEMPLATE</button>
          </span>
        </h2>
        <div id="code" class="panel-body"></div>
        <div id="config" class="panel-body" hidden></div>
        <div id="enemy-code" class="panel-body" hidden></div>
      </section>

      <section id="inspector" class="panel">
        <h2>
          <span>INSPECTOR</span>
          <span id="inspector-tabs"></span>
        </h2>
        <div id="inspector-fields" class="panel-body"></div>
      </section>

      <section id="lineup" class="panel">
        <h2>LINEUP</h2>
        <div id="lineup-slots" class="panel-body"></div>
      </section>

      <section id="results" class="panel">
        <h2>RESULTS</h2>
        <div id="result-rows" class="panel-body"></div>
      </section>

      <section id="battle" class="panel">
        <h2>BATTLE VIEW</h2>
        <div id="battle-frame">
          <canvas id="battle-canvas"></canvas>
        </div>
        <div id="transport">
          <button id="transport-play" class="tool-button" type="button">PLAY</button>
          <button id="step-back" class="tool-button" type="button" title="Step back: one line in DEBUG, one tick in RUN">◀1</button>
          <button id="step" class="tool-button" type="button" title="Step: one line in DEBUG, one tick in RUN">1▶</button>
          <button id="previous-run" class="tool-button" type="button" title="Back to the time before that the marked line runs">◀◆</button>
          <button id="next-run" class="tool-button" type="button" title="On to the next time the marked line runs">◆▶</button>
          <span id="seek-track">
            <canvas id="seek-marks"></canvas>
            <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek" />
          </span>
          <span id="speeds"></span>
          <span id="clock"></span>
        </div>
      </section>

      <section id="log" class="panel">
        <h2>DEBUG LOG</h2>
        <div id="log-rows" class="panel-body"></div>
      </section>

      <section id="watch" class="panel">
        <h2>
          <span>WATCH</span>
          <span id="watch-robot"></span>
        </h2>
        <div id="watch-fields" class="panel-body"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
